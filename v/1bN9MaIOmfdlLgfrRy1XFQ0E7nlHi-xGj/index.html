<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>사회수사비평</title>
<meta property="og:title" content="사회수사비평">
<meta property="og:url" content="https://2ullaonab-pixel.github.io/play/v/1bN9MaIOmfdlLgfrRy1XFQ0E7nlHi-xGj/">
<meta property="og:description" content="누르면 영상이 열립니다">
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #5f6368; --accent: #1a73e8; --box: #f1f3f4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --fg: #e8eaed; --muted: #9aa0a6; --accent: #8ab4f8; --box: #2a2b2e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
         line-height: 1.6; }
  main { max-width: 480px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.35rem; margin: 0 0 12px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); font-size: 0.95rem; }
  .btn { display: block; width: 100%; padding: 16px; border: 0; border-radius: 12px;
         background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 600;
         text-align: center; text-decoration: none; cursor: pointer; margin: 8px 0 20px; }
  @media (prefers-color-scheme: dark) { .btn { color: #17181a; } }
  .sub { display: block; width: 100%; padding: 12px; border: 1px solid var(--muted); border-radius: 10px;
         background: transparent; color: var(--fg); font-size: 1rem; cursor: pointer; margin-top: 8px; }
  .box { background: var(--box); border-radius: 12px; padding: 16px; margin-top: 8px; }
  .box ol { margin: 0; padding-left: 20px; }
  input { width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px;
          border: 1px solid var(--muted); background: var(--bg); color: var(--fg); }
  #msg { color: #d93025; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <section id="open" hidden>
    <h1>사회수사비평</h1>
    <p>영상을 여는 중입니다.</p>
    <p>잠시 뒤 크롬이나 구글 드라이브 앱에서 영상이 열립니다.</p>
    <a id="btn" class="btn" href="#">영상 열기</a>
    <div class="box">
      <p><strong>그래도 안 열리면</strong></p>
      <ol>
        <li>화면 위나 아래의 점 세 개(⋮ 또는 ⋯)를 누릅니다.</li>
        <li>"다른 브라우저로 열기"를 누릅니다.</li>
      </ol>
      <p class="muted" style="margin-top:12px">또는 아래 주소를 복사해 크롬에 붙여 넣으세요.</p>
      <input id="direct" readonly onclick="this.select()">
      <button id="copy" class="sub" type="button">주소 복사</button>
    </div>
  </section>

  <section id="make" hidden>
    <h1>카톡용 영상 링크 만들기</h1>
    <p>구글 드라이브에서 "링크 복사"한 영상 주소를 붙여 넣으세요.</p>
    <input id="src" placeholder="https://drive.google.com/file/d/...">
    <button id="gen" class="btn" type="button">링크 만들기</button>
    <div id="msg"></div>
    <div id="result" class="box" hidden>
      <p>이 링크를 카톡에 보내세요.</p>
      <input id="out" readonly onclick="this.select()">
      <button id="copyOut" class="sub" type="button">링크 복사</button>
    </div>
    <p class="muted" style="margin-top:20px">영상은 드라이브에서 "링크가 있는 모든 사용자"로 공유돼 있어야 합니다.</p>
  </section>
</main>
<script>window.PLAY_ID = '1bN9MaIOmfdlLgfrRy1XFQ0E7nlHi-xGj';</script>
<script src="../../app.js?v=3"></script>
</body>
</html>
